[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python generate_synthetic_data.py && python run_pipeline_synthetic.py && streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
